events {
    worker_connections 1024;
}

http {
    upstream feedlypet_backend {
        # Sticky sessions by IP for WebSocket support
        ip_hash;
        server feedlypet-backend-app-1:3000;
        server feedlypet-backend-app-2:3000;
        server feedlypet-backend-app-3:3000;
    }

    server {
        listen 80;

        # HTTP API
        location / {
            proxy_pass http://feedlypet_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # WebSocket (Socket.IO)
        location /socket.io/ {
            proxy_pass http://feedlypet_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
        }
    }
}
